<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bloom Health favicon: a simple 5-petal flower -->
  <circle cx="16" cy="16" r="4" fill="#F0607A"/>
  <!-- petals at 5 positions -->
  <ellipse cx="16" cy="8"  rx="3" ry="5" fill="#F5849A" transform="rotate(0   16 16)"/>
  <ellipse cx="16" cy="8"  rx="3" ry="5" fill="#F5849A" transform="rotate(72  16 16)"/>
  <ellipse cx="16" cy="8"  rx="3" ry="5" fill="#F5849A" transform="rotate(144 16 16)"/>
  <ellipse cx="16" cy="8"  rx="3" ry="5" fill="#F5849A" transform="rotate(216 16 16)"/>
  <ellipse cx="16" cy="8"  rx="3" ry="5" fill="#F5849A" transform="rotate(288 16 16)"/>
  <!-- centre dot -->
  <circle cx="16" cy="16" r="3.5" fill="#FFEAA7"/>
</svg>
